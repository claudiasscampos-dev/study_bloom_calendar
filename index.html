<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Bloom Calendar</title>
<style>
:root{
  --bg:#fff8f4;--paper:#fffdfb;--ink:#433b48;--muted:#8b8290;--line:#eadfe6;
  --pink:#f6b8cb;--pink2:#ffe0e9;--purple:#bba8e8;--green:#a8d8bd;--yellow:#f6d88b;
  --blue:#a9d7ea;--shadow:0 18px 45px rgba(91,65,82,.12);--radius:22px;
}
*{box-sizing:border-box} body{margin:0;font-family:Inter,"Segoe UI",system-ui,sans-serif;background:
radial-gradient(circle at 8% 5%,#ffe4ec 0 8%,transparent 9%),radial-gradient(circle at 90% 10%,#e8e0ff 0 7%,transparent 8%),linear-gradient(145deg,#fff8f4,#f8f4ff);color:var(--ink);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit} button{cursor:pointer}
.app{max-width:1500px;margin:auto;padding:24px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.brand{display:flex;gap:12px;align-items:center}.logo{width:52px;height:52px;border-radius:18px;background:linear-gradient(145deg,var(--pink),var(--purple));display:grid;place-items:center;font-size:28px;box-shadow:var(--shadow)}
h1{font-size:1.35rem;margin:0}.subtitle{font-size:.86rem;color:var(--muted);margin-top:3px}.top-actions,.navgroup,.view-tabs{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.85);padding:9px 13px;border-radius:13px;box-shadow:0 5px 14px rgba(80,55,70,.06)}.btn:hover{transform:translateY(-1px);border-color:#d8c7d2}.btn.primary{background:linear-gradient(135deg,#ef9fba,#b9a6e7);color:white;border:none;font-weight:700}.btn.icon{padding:9px 11px}.btn.danger{color:#b34b61}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}.card{background:rgba(255,253,251,.92);border:1px solid rgba(234,223,230,.9);border-radius:var(--radius);box-shadow:var(--shadow)}
.calendar-card{overflow:hidden}.calendar-head{padding:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}.period-title{font-size:1.2rem;font-weight:800;text-align:center;min-width:180px}
.view-tabs button{border:0;background:transparent;padding:8px 11px;border-radius:11px;color:var(--muted)}.view-tabs button.active{background:var(--pink2);color:#9d4966;font-weight:800}
.filters{padding:11px 18px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;overflow:auto}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:6px 10px;border-radius:999px;font-size:.8rem;display:flex;align-items:center;gap:6px}.chip.active{outline:2px solid rgba(72,62,80,.15);font-weight:700}.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
#calendar{min-height:650px}.month-grid{display:grid;grid-template-columns:repeat(7,1fr)}.weekday{padding:10px;text-align:center;color:var(--muted);font-size:.78rem;font-weight:800;border-bottom:1px solid var(--line)}.day-cell{min-height:112px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden}.day-cell:nth-child(7n){border-right:0}.day-cell.other{background:#fbf8fa;color:#bcb4bd}.day-cell.today .day-num{background:var(--pink);color:white}.day-num{width:27px;height:27px;display:grid;place-items:center;border-radius:50%;font-size:.82rem;font-weight:700;margin-bottom:5px}.event{font-size:.73rem;padding:5px 7px;border-radius:8px;margin:4px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:4px solid var(--event);background:color-mix(in srgb,var(--event) 22%,white);cursor:pointer}.more{font-size:.72rem;color:#936b82;padding:2px}
.year-wrap{padding:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.mini-month{border:1px solid var(--line);border-radius:16px;padding:10px;background:#fff}.mini-title{font-weight:800;text-align:center;margin-bottom:8px}.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.mini-grid span{font-size:.65rem;text-align:center;padding:3px 1px;border-radius:5px}.mini-grid .has{background:var(--pink2);font-weight:800}.mini-grid .muted{color:#c8c0c8}.year-events{margin-top:7px;border-top:1px dashed var(--line);padding-top:5px;font-size:.66rem;color:var(--muted);max-height:52px;overflow:auto}.year-event{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0}
.schedule{display:grid;grid-template-columns:58px repeat(var(--cols),minmax(110px,1fr));overflow:auto;max-height:720px}.sched-head{position:sticky;top:0;z-index:5;background:#fffafc;padding:10px 5px;text-align:center;border-bottom:1px solid var(--line);border-right:1px solid var(--line);font-size:.8rem;font-weight:800}.time-label{height:48px;padding:4px 6px;text-align:right;border-right:1px solid var(--line);border-bottom:1px solid #f1e9ee;font-size:.68rem;color:var(--muted)}.slot{height:48px;border-right:1px solid var(--line);border-bottom:1px solid #f1e9ee;position:relative;cursor:crosshair}.slot:hover{background:#fff4f7}.slot.selected{background:#ffe1eb}.timed-event{position:absolute;left:3px;right:3px;z-index:3;border-radius:8px;padding:5px 6px;font-size:.7rem;overflow:hidden;background:color-mix(in srgb,var(--event) 28%,white);border-left:4px solid var(--event);box-shadow:0 3px 8px rgba(60,40,55,.12);cursor:pointer}
.sidebar{display:flex;flex-direction:column;gap:18px}.side-card{padding:17px}.side-card h2{font-size:1rem;margin:0 0 12px}.notes{width:100%;min-height:150px;border:1px solid var(--line);border-radius:14px;padding:12px;resize:vertical;background:#fffcf5;outline:none}.notes:focus,input:focus,select:focus,textarea:focus{border-color:#c8a9bb;box-shadow:0 0 0 3px #fbe3eb;outline:none}.todo-add{display:flex;gap:7px}.todo-add input{width:100%;border:1px solid var(--line);padding:9px;border-radius:11px}.todo-list{display:flex;flex-direction:column;gap:7px;margin-top:12px;max-height:240px;overflow:auto}.todo{display:flex;align-items:center;gap:8px;padding:8px;border-radius:11px;background:#fff7fa}.todo span{flex:1;font-size:.84rem}.todo.done span{text-decoration:line-through;color:#aaa}.todo button{border:0;background:none;color:#b66;font-size:1rem}.legend{display:flex;flex-direction:column;gap:8px}.legend-row{display:flex;align-items:center;gap:8px;font-size:.82rem}.legend-row span:nth-child(2){flex:1}.tag-del{border:0;background:none;color:#bb7285}.tip{font-size:.78rem;line-height:1.5;color:var(--muted);background:#f8f0ff;padding:11px;border-radius:13px}
.modal-backdrop{position:fixed;inset:0;background:rgba(48,36,48,.38);display:none;place-items:center;z-index:20;padding:18px}.modal-backdrop.open{display:grid}.modal{background:#fffdfb;width:min(520px,100%);border-radius:24px;padding:22px;box-shadow:0 25px 70px rgba(45,28,40,.28)}.modal h2{margin:0 0 16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:.76rem;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{padding:10px;border:1px solid var(--line);border-radius:11px;background:white}.modal-actions{display:flex;justify-content:space-between;gap:8px;margin-top:18px}.right-actions{display:flex;gap:8px}.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:#4c414d;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:50}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:1fr 1fr}.year-wrap{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.app{padding:10px}.sidebar{grid-template-columns:1fr}.year-wrap{grid-template-columns:1fr}.day-cell{min-height:88px;padding:4px}.event{padding:3px;font-size:.66rem}.form-grid{grid-template-columns:1fr}.field.full{grid-column:1}.calendar-head{justify-content:center}.topbar{justify-content:center}.brand{width:100%;justify-content:center}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
 <div class="brand"><div class="logo">🌸</div><div><h1>Study Bloom</h1><div class="subtitle">O teu calendário de estudo, com calma e foco</div></div></div>
 <div class="top-actions"><button class="btn" id="todayBtn">Hoje</button><button class="btn primary" id="newTaskBtn">＋ Nova tarefa</button></div>
</header>
<div class="layout">
 <main class="card calendar-card">
  <div class="calendar-head">
   <div class="navgroup"><button class="btn icon" id="prevBtn">‹</button><button class="btn icon" id="nextBtn">›</button></div>
   <div class="period-title" id="periodTitle"></div>
   <div class="view-tabs"><button data-view="year">Ano</button><button data-view="month" class="active">Mês</button><button data-view="week">Semana</button><button data-view="day">Dia</button></div>
  </div>
  <div class="filters" id="filters"><strong style="font-size:.78rem">Filtrar:</strong></div>
  <div id="calendar"></div>
 </main>
 <aside class="sidebar">
  <section class="card side-card"><h2>📝 Notas rápidas</h2><textarea class="notes" id="notes" placeholder="Datas importantes, objetivos, lembretes..."></textarea><div class="subtitle" style="margin-top:7px">Guardado automaticamente</div></section>
  <section class="card side-card"><h2>✓ Lista rápida</h2><div class="todo-add"><input id="todoInput" placeholder="Adicionar tarefa rápida..."><button class="btn primary" id="todoAdd">＋</button></div><div class="todo-list" id="todoList"></div></section>
  <section class="card side-card"><h2>🏷️ Etiquetas</h2><div class="legend" id="tagLegend"></div><button class="btn" id="addTagBtn" style="width:100%;margin-top:12px">＋ Adicionar etiqueta</button></section>
  <div class="tip">💡 <strong>Dica:</strong> nas vistas Semana e Dia, clica numa hora ou arrasta por várias horas para reservar um bloco de estudo.</div>
 </aside>
</div>
</div>
<div class="modal-backdrop" id="taskModal"><div class="modal">
 <h2 id="modalTitle">Nova tarefa</h2>
 <div class="form-grid">
  <div class="field full"><label>Título</label><input id="taskTitle" placeholder="Ex.: Rever capítulo 3"></div>
  <div class="field"><label>Data</label><input type="date" id="taskDate"></div>
  <div class="field"><label>Etiqueta</label><select id="taskTag"></select></div>
  <div class="field"><label>Hora de início</label><input type="time" id="taskStart" step="1800"></div>
  <div class="field"><label>Hora de fim</label><input type="time" id="taskEnd" step="1800"></div>
  <div class="field full"><label>Notas</label><textarea id="taskNotes" rows="3" placeholder="Detalhes, materiais ou objetivos..."></textarea></div>
 </div>
 <div class="modal-actions"><button class="btn danger" id="deleteTask" style="visibility:hidden">Eliminar</button><div class="right-actions"><button class="btn" id="cancelTask">Cancelar</button><button class="btn primary" id="saveTask">Guardar</button></div></div>
</div></div>
<div class="modal-backdrop" id="tagModal"><div class="modal" style="max-width:390px"><h2>Nova etiqueta</h2><div class="field"><label>Nome</label><input id="tagName" placeholder="Ex.: Matemática"></div><div class="field" style="margin-top:12px"><label>Cor</label><input type="color" id="tagColor" value="#a9d7ea" style="height:44px;width:100%"></div><div class="modal-actions"><span></span><div class="right-actions"><button class="btn" id="cancelTag">Cancelar</button><button class="btn primary" id="saveTag">Criar</button></div></div></div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const key='studyBloomDataV1';
const base={tasks:[],tags:[{id:'study',name:'Estudo',color:'#f3a9c0'},{id:'personal',name:'Pessoal',color:'#b6a5e3'},{id:'work',name:'Trabalho',color:'#91cdb0'},{id:'exam',name:'Exames',color:'#efc766'}],todos:[],notes:''};
let data=JSON.parse(localStorage.getItem(key)||'null')||base;if(!data.tags?.length)data.tags=base.tags;
let view='month', cursor=new Date(), activeTags=new Set(data.tags.map(t=>t.id)), editingId=null, drag=null;
const pad=n=>String(n).padStart(2,'0'); const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDate=s=>{let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const esc=s=>(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function save(){localStorage.setItem(key,JSON.stringify(data))} function tag(id){return data.tags.find(t=>t.id===id)||{name:'Sem etiqueta',color:'#bbb'}}
function notify(s){let x=$('#toast');x.textContent=s;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1600)}
const months=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const weekNames=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
function monday(d){let x=new Date(d),n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);x.setHours(0,0,0,0);return x}
function visibleTasks(date){return data.tasks.filter(t=>t.date===iso(date)&&activeTags.has(t.tag)).sort((a,b)=>(a.start||'99').localeCompare(b.start||'99'))}
function render(){renderFilters();renderTags();$$('.view-tabs button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='month')renderMonth();if(view==='year')renderYear();if(view==='week')renderSchedule(7);if(view==='day')renderSchedule(1)}
function renderFilters(){let f=$('#filters');f.innerHTML='<strong style="font-size:.78rem">Filtrar:</strong>'+data.tags.map(t=>`<button class="chip ${activeTags.has(t.id)?'active':''}" data-filter="${t.id}"><i class="dot" style="background:${t.color}"></i>${esc(t.name)}</button>`).join('')+`<button class="chip" id="allTags">Todas</button>`;$$('[data-filter]').forEach(b=>b.onclick=()=>{let id=b.dataset.filter;activeTags.has(id)?activeTags.delete(id):activeTags.add(id);render()});$('#allTags').onclick=()=>{activeTags=new Set(data.tags.map(t=>t.id));render()}}
function eventHtml(t){let tg=tag(t.tag);return `<div class="event" data-task="${t.id}" style="--event:${tg.color}" title="${esc(t.title)}">${t.start?esc(t.start)+' ':''}${esc(t.title)}</div>`}
function renderMonth(){let y=cursor.getFullYear(),m=cursor.getMonth();$('#periodTitle').textContent=`${months[m]} ${y}`;let first=new Date(y,m,1),start=new Date(y,m,1-((first.getDay()+6)%7));let out='<div class="month-grid">'+weekNames.map(x=>`<div class="weekday">${x}</div>`).join('');for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let ts=visibleTasks(d);let today=iso(d)===iso(new Date());out+=`<div class="day-cell ${d.getMonth()!==m?'other':''} ${today?'today':''}" data-date="${iso(d)}"><div class="day-num">${d.getDate()}</div>${ts.slice(0,3).map(eventHtml).join('')}${ts.length>3?`<div class="more">+${ts.length-3} mais</div>`:''}</div>`}out+='</div>';$('#calendar').innerHTML=out;bindEvents();$$('.day-cell').forEach(c=>c.ondblclick=e=>{if(!e.target.closest('.event'))openTask({date:c.dataset.date})})}
function renderYear(){let y=cursor.getFullYear();$('#periodTitle').textContent=y;let out='<div class="year-wrap">';for(let m=0;m<12;m++){let first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();let cells='';for(let i=0;i<start;i++)cells+='<span class="muted"></span>';for(let d=1;d<=days;d++){let dt=new Date(y,m,d),has=visibleTasks(dt).length;cells+=`<span class="${has?'has':''}" data-jump="${iso(dt)}">${d}</span>`}let mts=data.tasks.filter(t=>parseDate(t.date).getFullYear()===y&&parseDate(t.date).getMonth()===m&&activeTags.has(t.tag)).sort((a,b)=>a.date.localeCompare(b.date));out+=`<div class="mini-month"><div class="mini-title">${months[m]}</div><div class="mini-grid">${weekNames.map(x=>`<span class="muted">${x[0]}</span>`).join('')}${cells}</div><div class="year-events">${mts.slice(0,4).map(t=>`<div class="year-event" data-task="${t.id}"><i class="dot" style="background:${tag(t.tag).color}"></i> ${parseDate(t.date).getDate()} · ${esc(t.title)}</div>`).join('')||'Sem tarefas'}</div></div>`}out+='</div>';$('#calendar').innerHTML=out;$$('[data-jump]').forEach(x=>x.onclick=()=>{cursor=parseDate(x.dataset.jump);view='day';render()});bindEvents()}
function renderSchedule(cols){let start=cols===7?monday(cursor):new Date(cursor);let dates=[];for(let i=0;i<cols;i++){let d=new Date(start);d.setDate(start.getDate()+i);dates.push(d)};$('#periodTitle').textContent=cols===1?`${dates[0].getDate()} de ${months[dates[0].getMonth()]} de ${dates[0].getFullYear()}`:`${dates[0].getDate()} ${months[dates[0].getMonth()].slice(0,3)} – ${dates[6].getDate()} ${months[dates[6].getMonth()].slice(0,3)} ${dates[6].getFullYear()}`;let out=`<div class="schedule" style="--cols:${cols}"><div class="sched-head"></div>`+dates.map(d=>`<div class="sched-head">${weekNames[(d.getDay()+6)%7]}<br>${d.getDate()} ${months[d.getMonth()].slice(0,3)}</div>`).join('');for(let h=6;h<24;h++){out+=`<div class="time-label">${pad(h)}:00</div>`;for(let c=0;c<cols;c++)out+=`<div class="slot" data-date="${iso(dates[c])}" data-hour="${h}"></div>`}out+='</div>';$('#calendar').innerHTML=out;dates.forEach((d,c)=>visibleTasks(d).filter(t=>t.start).forEach(t=>{let sh=+t.start.split(':')[0]+(+t.start.split(':')[1]/60),eh=t.end?+t.end.split(':')[0]+(+t.end.split(':')[1]/60):sh+1;if(sh<6||sh>=24)return;let row=Math.floor(sh)-6;let slot=$(`.slot[data-date="${iso(d)}"][data-hour="${Math.floor(sh)}"]`);if(slot){let el=document.createElement('div');el.className='timed-event';el.dataset.task=t.id;el.style.cssText=`--event:${tag(t.tag).color};top:${(sh-Math.floor(sh))*48}px;height:${Math.max(24,(eh-sh)*48-3)}px`;el.innerHTML=`<strong>${esc(t.start)}</strong> ${esc(t.title)}`;slot.appendChild(el)}}));bindEvents();bindSlots()}
function bindEvents(){$$('[data-task]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();let t=data.tasks.find(x=>x.id===e.dataset.task);if(t)openTask(t)})}
function bindSlots(){$$('.slot').forEach(s=>{s.onmousedown=e=>{if(e.target.closest('.timed-event'))return;drag={date:s.dataset.date,start:+s.dataset.hour,end:+s.dataset.hour+1};s.classList.add('selected')};s.onmouseenter=()=>{if(drag&&drag.date===s.dataset.date){drag.end=Math.max(drag.start+1,+s.dataset.hour+1);$$('.slot').forEach(x=>x.classList.toggle('selected',x.dataset.date===drag.date&&+x.dataset.hour>=drag.start&&+x.dataset.hour<drag.end))}}});document.onmouseup=()=>{if(drag){let d=drag;drag=null;$$('.slot').forEach(x=>x.classList.remove('selected'));openTask({date:d.date,start:`${pad(d.start)}:00`,end:`${pad(Math.min(d.end,23))}:00`})}}}
function openTask(t={}){editingId=t.id||null;$('#modalTitle').textContent=editingId?'Editar tarefa':'Nova tarefa';$('#taskTitle').value=t.title||'';$('#taskDate').value=t.date||iso(cursor);$('#taskStart').value=t.start||'';$('#taskEnd').value=t.end||'';$('#taskNotes').value=t.notes||'';fillTagSelect();$('#taskTag').value=t.tag||data.tags[0]?.id||'';$('#deleteTask').style.visibility=editingId?'visible':'hidden';$('#taskModal').classList.add('open');setTimeout(()=>$('#taskTitle').focus(),50)}
function fillTagSelect(){$('#taskTag').innerHTML=data.tags.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}
function closeTask(){$('#taskModal').classList.remove('open')}
$('#saveTask').onclick=()=>{let title=$('#taskTitle').value.trim(),date=$('#taskDate').value;if(!title||!date){notify('Indica um título e uma data');return}let obj={id:editingId||crypto.randomUUID(),title,date,tag:$('#taskTag').value,start:$('#taskStart').value,end:$('#taskEnd').value,notes:$('#taskNotes').value.trim()};if(obj.start&&obj.end&&obj.end<=obj.start){notify('A hora final deve ser posterior');return}let i=data.tasks.findIndex(t=>t.id===editingId);i>=0?data.tasks[i]=obj:data.tasks.push(obj);save();closeTask();render();notify(editingId?'Tarefa atualizada':'Tarefa criada')};
$('#deleteTask').onclick=()=>{data.tasks=data.tasks.filter(t=>t.id!==editingId);save();closeTask();render();notify('Tarefa eliminada')};$('#cancelTask').onclick=closeTask;$('#taskModal').onclick=e=>{if(e.target.id==='taskModal')closeTask()};
$('#newTaskBtn').onclick=()=>openTask({date:iso(cursor)});$('#todayBtn').onclick=()=>{cursor=new Date();render()};
$('#prevBtn').onclick=()=>move(-1);$('#nextBtn').onclick=()=>move(1);function move(n){if(view==='year')cursor.setFullYear(cursor.getFullYear()+n);if(view==='month')cursor.setMonth(cursor.getMonth()+n);if(view==='week')cursor.setDate(cursor.getDate()+7*n);if(view==='day')cursor.setDate(cursor.getDate()+n);cursor=new Date(cursor);render()}
$$('.view-tabs button').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});
function renderTags(){$('#tagLegend').innerHTML=data.tags.map(t=>`<div class="legend-row"><i class="dot" style="background:${t.color}"></i><span>${esc(t.name)}</span><button class="tag-del" data-deltag="${t.id}" title="Eliminar">×</button></div>`).join('');$$('[data-deltag]').forEach(b=>b.onclick=()=>{if(data.tags.length===1){notify('Mantém pelo menos uma etiqueta');return}let id=b.dataset.deltag;if(data.tasks.some(t=>t.tag===id)){notify('Esta etiqueta está a ser utilizada');return}data.tags=data.tags.filter(t=>t.id!==id);activeTags.delete(id);save();render()})}
$('#addTagBtn').onclick=()=>$('#tagModal').classList.add('open');$('#cancelTag').onclick=()=>$('#tagModal').classList.remove('open');$('#saveTag').onclick=()=>{let name=$('#tagName').value.trim();if(!name)return;let id='tag-'+Date.now();data.tags.push({id,name,color:$('#tagColor').value});activeTags.add(id);$('#tagName').value='';save();$('#tagModal').classList.remove('open');render();notify('Etiqueta criada')};
$('#notes').value=data.notes||'';let noteTimer;$('#notes').oninput=e=>{clearTimeout(noteTimer);noteTimer=setTimeout(()=>{data.notes=e.target.value;save()},300)};
function renderTodos(){$('#todoList').innerHTML=data.todos.map(t=>`<div class="todo ${t.done?'done':''}"><input type="checkbox" data-check="${t.id}" ${t.done?'checked':''}><span>${esc(t.text)}</span><button data-deltodo="${t.id}">×</button></div>`).join('')||'<div class="subtitle">A tua lista está vazia 🌱</div>';$$('[data-check]').forEach(x=>x.onchange=()=>{let t=data.todos.find(t=>t.id===x.dataset.check);t.done=x.checked;save();renderTodos()});$$('[data-deltodo]').forEach(x=>x.onclick=()=>{data.todos=data.todos.filter(t=>t.id!==x.dataset.deltodo);save();renderTodos()})}
function addTodo(){let v=$('#todoInput').value.trim();if(!v)return;data.todos.push({id:crypto.randomUUID(),text:v,done:false});$('#todoInput').value='';save();renderTodos()}$('#todoAdd').onclick=addTodo;$('#todoInput').onkeydown=e=>{if(e.key==='Enter')addTodo()};
renderTodos();render();
</script>
</body>
</html>
